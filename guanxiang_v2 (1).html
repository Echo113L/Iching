<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101612">
<title>观象 · 六爻起卦</title>
<style>
:root{
  --ink:#151b17;
  --ink-2:#1c2620;
  --teal:#253630;
  --teal-2:#30473f;
  --paper:#efe7d4;
  --paper-2:#f6f0e4;
  --paper-3:#e6dac0;
  --gold:#b69a5a;
  --gold-soft:#d2bf8d;
  --line:#c7b998;
  --text:#2e2c27;
  --muted:#746e62;
  --danger:#9c5c4d;
  --shadow:0 24px 70px rgba(0,0,0,.26);
  --radius:14px;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--paper-2);
  background:
    radial-gradient(circle at 50% 14%, rgba(182,154,90,.14), transparent 28%),
    radial-gradient(circle at 14% 42%, rgba(79,111,97,.16), transparent 26%),
    radial-gradient(circle at 88% 82%, rgba(20,32,27,.52), transparent 32%),
    linear-gradient(180deg,#0c100f 0%,#121916 48%,#0c100f 100%);
  font-family:var(--sans);
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; opacity:.22;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.05) 0 1px, transparent 1.5px),
    radial-gradient(circle at 72% 18%, rgba(255,255,255,.04) 0 1px, transparent 1.5px),
    radial-gradient(circle at 41% 79%, rgba(255,255,255,.035) 0 1px, transparent 1.5px);
  background-size:180px 180px,240px 240px,200px 200px;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.fade-in{animation:fadeIn .55s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:.62;transform:scale(.98)}50%{opacity:1;transform:scale(1.02)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes coinToss{0%{transform:translateY(0) rotateY(0deg) scale(1)}22%{transform:translateY(-32px) rotateY(100deg) scale(.94)}48%{transform:translateY(-8px) rotateY(220deg) scale(1.02)}75%{transform:translateY(-22px) rotateY(310deg) scale(.96)}100%{transform:translateY(0) rotateY(360deg) scale(1)}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(182,154,90,0)}50%{box-shadow:0 0 0 7px rgba(182,154,90,.12)}}
@keyframes revealLine{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.shell{width:min(1180px,100%);margin:0 auto;padding:28px 18px 60px;position:relative}

/* Top frame */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 2px 18px;border-bottom:1px solid rgba(210,191,141,.16)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:30px;height:30px;border:1px solid rgba(210,191,141,.65);display:grid;place-items:center;color:var(--gold-soft);position:relative;font-family:var(--serif);font-size:12px;transform:rotate(45deg)}
.brand-mark::after{content:"";width:8px;height:8px;border:1px solid rgba(210,191,141,.65);position:absolute}
.brand-mark span{transform:rotate(-45deg)}
.brand-name{font-family:var(--serif);letter-spacing:.24em;font-size:14px;color:#eadfca}
.top-actions{display:flex;align-items:center;gap:8px}
.ghost-btn{border:1px solid rgba(210,191,141,.25);background:rgba(14,21,18,.42);color:#cfc6b5;padding:8px 12px;border-radius:999px;font-size:12px;transition:.2s ease}
.ghost-btn:hover{border-color:rgba(210,191,141,.6);color:#f1e8d7;background:rgba(31,43,37,.72)}

/* Intro */
.intro{min-height:calc(100vh - 110px);display:grid;place-items:center;padding:64px 0 48px}
.intro-card{width:min(820px,100%);text-align:center;position:relative;padding:30px 22px 52px}
.kicker{font-size:11px;letter-spacing:.38em;color:var(--gold-soft);margin-bottom:24px}
.intro h1{font-family:var(--serif);font-weight:500;letter-spacing:.34em;font-size:clamp(48px,9vw,96px);margin:0 0 14px;color:#f2eadb;text-shadow:0 10px 30px rgba(0,0,0,.24)}
.intro-sub{font-family:var(--serif);font-size:15px;letter-spacing:.18em;color:#cfc5b2;margin-bottom:36px}
.intro-quote{font-family:var(--serif);font-size:14px;line-height:2;color:#948e80;max-width:560px;margin:0 auto 34px}
.divider-orbit{width:180px;height:18px;margin:0 auto 26px;position:relative}
.divider-orbit::before,.divider-orbit::after{content:"";position:absolute;top:8px;height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold));}
.divider-orbit::before{left:0}.divider-orbit::after{right:0;transform:rotate(180deg)}
.divider-orbit span{position:absolute;left:50%;top:4px;width:8px;height:8px;border:1px solid var(--gold);transform:translateX(-50%) rotate(45deg);opacity:.78}
.intro-btn{border:1px solid rgba(210,191,141,.75);background:linear-gradient(180deg,rgba(43,61,53,.96),rgba(27,39,34,.96));color:#f0e7d5;padding:14px 34px;border-radius:999px;letter-spacing:.18em;font-family:var(--serif);font-size:15px;box-shadow:0 14px 42px rgba(0,0,0,.2);transition:.25s ease}
.intro-btn:hover{transform:translateY(-2px);border-color:var(--gold-soft);box-shadow:0 18px 48px rgba(0,0,0,.28)}
.intro-seal{position:absolute;right:18px;bottom:5px;width:50px;height:62px;border:1px solid rgba(156,92,77,.5);display:grid;place-items:center;color:#9c5c4d;font-family:var(--serif);font-size:14px;writing-mode:vertical-rl;letter-spacing:.22em;opacity:.8}

/* Divination workspace */
.app{animation:fadeIn .65s ease both}
.paper{color:var(--text);background:
  radial-gradient(circle at 10% 14%,rgba(182,154,90,.09),transparent 22%),
  linear-gradient(135deg,rgba(255,255,255,.12),transparent 36%),
  var(--paper);
  border:1px solid rgba(210,191,141,.52);
  box-shadow:var(--shadow);
  border-radius:18px;
  overflow:hidden;
  position:relative;
}
.paper::before{content:"";position:absolute;inset:12px;border:1px solid rgba(116,110,98,.11);pointer-events:none;border-radius:12px}
.paper-inner{position:relative;padding:34px}
.question-panel{display:grid;grid-template-columns:1.3fr .7fr;gap:28px;align-items:end;padding-bottom:28px;border-bottom:1px solid rgba(116,110,98,.18)}
.section-kicker{font-size:11px;letter-spacing:.26em;color:#8b7a5d;margin-bottom:10px}
.question-title{font-family:var(--serif);font-size:26px;letter-spacing:.08em;font-weight:500;margin-bottom:12px;color:#2b2924}
.question-input{width:100%;min-height:92px;resize:vertical;border:1px solid #cdbf9e;background:rgba(248,243,232,.78);border-radius:10px;padding:13px 15px;color:#2e2c27;line-height:1.7;outline:none;transition:.2s}
.question-input:focus{border-color:#9d8656;box-shadow:0 0 0 3px rgba(182,154,90,.11)}
.question-input::placeholder{color:#9b9384}
.category-side{padding:4px 0 0}
.category-grid{display:flex;flex-wrap:wrap;gap:8px}
.category-chip{border:1px solid #ccbfa2;background:rgba(249,245,235,.75);color:#625d52;padding:7px 12px;border-radius:999px;font-size:12px;transition:.2s}
.category-chip:hover,.category-chip.active{background:#2d4038;color:#f2eadc;border-color:#2d4038}
.category-note{margin-top:12px;font-size:11px;color:#8d877a;line-height:1.7}

.progress-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 0 12px}
.progress-title{font-family:var(--serif);font-size:16px;letter-spacing:.11em}
.progress-meta{font-size:12px;color:#847e72}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.step{height:8px;background:#dbcfb6;border-radius:99px;position:relative;overflow:hidden}
.step::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#8f794e,#c5af79);transform:translateX(-100%);transition:transform .35s ease}
.step.done::after{transform:none}.step.current::after{transform:translateX(-35%);animation:pulseGold 1.8s ease infinite}

.toss-stage{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:30px;align-items:center;padding:26px 0 14px}
.coin-desk{background:
  linear-gradient(145deg,rgba(255,255,255,.24),rgba(230,218,192,.16)),
  #dfd1b2;
  border:1px solid #cdbf9f;border-radius:16px;padding:28px 18px 22px;min-height:355px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.coin-desk::before{content:"";position:absolute;width:460px;height:180px;left:50%;top:-120px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,252,243,.72),transparent 62%);filter:blur(5px)}
.coin-desk::after{content:"乾  坎  艮  震  巽  离  坤  兑";position:absolute;bottom:11px;left:50%;transform:translateX(-50%);white-space:nowrap;color:rgba(96,86,68,.18);font-family:var(--serif);font-size:11px;letter-spacing:.35em}
.coins{display:flex;gap:22px;min-height:104px;align-items:center;justify-content:center;position:relative;z-index:1}
.coin{width:82px;height:82px;border-radius:50%;position:relative;border:3px solid #6d5723;background:radial-gradient(circle at 34% 28%,#f0d77d 0%,#c7a64e 45%,#8e6d25 80%,#644b18 100%);box-shadow:0 8px 16px rgba(73,57,25,.28),inset 0 -5px 8px rgba(0,0,0,.16),inset 0 2px 5px rgba(255,255,255,.25);color:#594717;display:grid;place-items:center;font-family:var(--serif);font-size:14px;user-select:none;transform-style:preserve-3d}
.coin::before{content:"";width:20px;height:20px;background:#dfd1b2;border:2px solid #765d22;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.coin .coin-face{position:absolute;inset:0;display:grid;place-items:start center;padding-top:9px;opacity:.86;z-index:3;font-size:10px}
.coin .coin-face::after{content:"";width:55px;height:55px;border:1px solid rgba(90,70,25,.34);border-radius:50%;position:absolute}
.coin.flipping{animation:coinToss .78s cubic-bezier(.18,.8,.22,1)}
.toss-caption{margin-top:18px;text-align:center;font-size:12px;color:#7f7768;letter-spacing:.11em;position:relative;z-index:1}
.result-line{margin-top:8px;min-height:28px;font-family:var(--serif);font-size:15px;color:#4b4438;position:relative;z-index:1}
.result-line .gold{color:#8e7444}
.toss-btn-main{margin-top:18px;min-width:162px;border:1px solid #6a765f;background:#2c4138;color:#f4ecdc;padding:12px 20px;border-radius:999px;letter-spacing:.16em;font-family:var(--serif);transition:.2s}
.toss-btn-main:hover{transform:translateY(-2px);background:#324b41}.toss-btn-main:disabled{opacity:.45;cursor:not-allowed;transform:none}

.hex-card{background:rgba(249,245,235,.58);border:1px solid #cdbf9e;border-radius:16px;padding:22px;min-height:355px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.hex-card::before{content:"卦";position:absolute;left:16px;top:12px;color:rgba(116,110,98,.13);font-family:var(--serif);font-size:38px}
.hex-card::after{content:"象";position:absolute;right:16px;bottom:12px;color:rgba(116,110,98,.13);font-family:var(--serif);font-size:38px}
.hex-status{font-size:11px;color:#8a7e68;letter-spacing:.25em;margin-bottom:12px}
.hex-title{font-family:var(--serif);font-size:20px;letter-spacing:.15em;margin-bottom:14px;color:#2e2b24}
.hex-glyph{font-family:"Noto Serif SC","STSong",serif;font-size:72px;line-height:1;color:#222923;margin-bottom:10px}
.hex-lines{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 8px}
.yao-line{width:184px;height:18px;display:flex;justify-content:center;align-items:center;position:relative;animation:revealLine .35s ease both}
.line-shape{height:7px;background:#222923;border-radius:999px;position:relative;display:block}
.line-shape.yang{width:145px}.line-shape.yin{width:145px;background:linear-gradient(90deg,#222923 0 42%,transparent 42% 58%,#222923 58% 100%)}
.yao-label{position:absolute;right:-2px;transform:translateX(100%);font-size:10px;color:#8e7444;font-family:var(--serif)}
.yao-line.changing .line-shape::after{content:"";position:absolute;right:-14px;top:50%;width:7px;height:7px;border:1px solid #9e7e3e;border-radius:50%;transform:translateY(-50%);box-shadow:0 0 0 4px rgba(182,154,90,.11)}
.hex-empty{font-family:var(--serif);color:#8f8879;font-size:13px;letter-spacing:.14em;line-height:1.8;text-align:center}

/* Result */
.result-wrap{padding-top:34px;border-top:1px solid rgba(116,110,98,.18);margin-top:28px}
.result-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px}
.result-head h2{font-family:var(--serif);font-size:28px;font-weight:500;margin:0;letter-spacing:.1em;color:#26251f}
.result-head p{margin:6px 0 0;font-size:12px;color:#827b6f}
.result-actions{display:flex;gap:8px;flex-wrap:wrap}
.paper-btn{border:1px solid #c8ba9e;background:rgba(249,245,235,.7);color:#5f594e;padding:8px 12px;border-radius:999px;font-size:12px}.paper-btn:hover{border-color:#9f8c65;color:#2e2c27}.paper-btn.accent{background:#30453c;border-color:#30453c;color:#f4ecdc}.paper-btn.accent:hover{background:#3b564b;border-color:#3b564b;color:#fffaf0}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.read-card{border:1px solid #d2c6aa;background:rgba(250,247,239,.7);border-radius:14px;padding:18px}
.read-card.full{grid-column:1/-1}
.card-kicker{font-size:10px;letter-spacing:.24em;color:#8e7444;margin-bottom:8px}
.card-title{font-family:var(--serif);font-size:18px;letter-spacing:.07em;color:#2c2a25;margin-bottom:10px}
.card-body{font-size:13px;line-height:1.9;color:#4d493f}
.hero-result{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:center;background:linear-gradient(135deg,rgba(231,220,196,.72),rgba(250,247,239,.82));border:1px solid #c8ba9e;border-radius:16px;padding:20px;margin-bottom:16px}
.hero-glyph{font-family:"Noto Serif SC","STSong",serif;font-size:84px;text-align:center;line-height:1;color:#222923}
.hero-meta .small{font-size:11px;color:#887f71;letter-spacing:.18em}.hero-meta h3{font-family:var(--serif);font-size:38px;font-weight:500;letter-spacing:.1em;margin:5px 0 8px}.hero-meaning{color:#6e6047;font-family:var(--serif);font-size:14px}.hero-question{margin-top:14px;padding-top:13px;border-top:1px solid rgba(116,110,98,.18);font-size:13px;line-height:1.8;color:#595348}.hero-question b{color:#8c7345;font-weight:500}
.change-flow{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:14px;margin-bottom:16px}.flow-node{background:rgba(250,247,239,.72);border:1px solid #d0c3a6;border-radius:14px;padding:16px;text-align:center}.flow-node .glyph{font-family:"Noto Serif SC",serif;font-size:48px;color:#27302a;line-height:1}.flow-node .name{font-family:var(--serif);font-size:18px;margin-top:6px}.flow-node .sub{font-size:11px;color:#887f71;margin-top:4px}.flow-arrow{text-align:center;color:#9f8651;font-family:var(--serif);font-size:26px}.change-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#e9dec2;color:#80683d;font-size:10px;margin-top:7px}
.classical{padding:12px 14px;background:#eee6d7;border-left:2px solid #b69a5a;color:#554f45;font-family:var(--serif);font-size:13px;line-height:1.9}
.quote-list p{margin:0 0 9px}.quote-list p:last-child{margin-bottom:0}
.story{padding:12px 0;border-bottom:1px solid rgba(116,110,98,.12)}.story:last-child{border-bottom:0}.story h4{margin:0 0 5px;font-family:var(--serif);font-size:15px;font-weight:500;color:#37332b}.story p{margin:0;font-size:13px;line-height:1.85;color:#595348}.story .source{text-align:right;color:#8b8477;font-size:10px;margin-top:5px}
.category-card{grid-column:1/-1}.cat-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.cat-tab{border:1px solid #ccbfa2;background:#f8f3e8;color:#686154;padding:7px 10px;border-radius:999px;font-size:11px;transition:.2s}.cat-tab:hover,.cat-tab.active{background:#30453c;color:#f2eadb;border-color:#30453c}.cat-content{font-size:13px;line-height:1.95;color:#4f4a41;min-height:26px}.theme-lead{padding:16px 17px;background:linear-gradient(135deg,#f0e8d8,#f7f2e8);border:1px solid #d4c6a7;border-left:3px solid #b69a5a;border-radius:11px}.theme-lead .theme-label{font-size:10px;letter-spacing:.2em;color:#8e7444;margin-bottom:6px}.theme-lead .theme-title{font-family:var(--serif);font-size:22px;color:#2f2d27;margin-bottom:8px}.theme-lead p{margin:0;font-size:13px;line-height:1.95;color:#514c43}.theme-panels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:11px}.theme-panel{padding:13px 14px;background:#fbf8f0;border:1px solid #ddd1b8;border-radius:11px}.theme-panel h4{margin:0 0 6px;font-family:var(--serif);font-size:14px;font-weight:500;color:#5f533c}.theme-panel p{margin:0;font-size:12px;line-height:1.85;color:#6b6459}.theme-classic{margin-top:11px}.theme-classic .classical{font-size:12px}.theme-footnote{margin-top:11px;padding-top:10px;border-top:1px solid rgba(116,110,98,.14);font-size:11px;line-height:1.8;color:#8b8478}@media(max-width:900px){.theme-panels{grid-template-columns:1fr}}
.notice{padding:14px 15px;border:1px solid #d1bf9a;background:#f3ead8;border-radius:12px}.notice strong{font-family:var(--serif);font-weight:500;color:#725b32}.notice p{margin:6px 0 0;font-size:12px;line-height:1.8;color:#655e53}
.archive-strip{margin-top:18px;padding-top:16px;border-top:1px solid rgba(116,110,98,.16);display:flex;justify-content:space-between;gap:16px;align-items:center}.archive-meta{font-size:11px;color:#8d8679}.archive-meta b{font-family:var(--serif);font-size:13px;color:#51493d;font-weight:500}

/* History drawer */
.drawer-backdrop{position:fixed;inset:0;background:rgba(7,10,9,.68);backdrop-filter:blur(7px);z-index:40;opacity:0;pointer-events:none;transition:.25s}.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:0;top:0;height:100vh;width:min(460px,92vw);background:#eee5d3;color:#37332b;z-index:41;transform:translateX(104%);transition:transform .3s cubic-bezier(.2,.7,.2,1);box-shadow:-22px 0 60px rgba(0,0,0,.26);display:flex;flex-direction:column}.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:22px 20px;border-bottom:1px solid #d0c1a3}.drawer-head h3{font-family:var(--serif);font-weight:500;letter-spacing:.1em;margin:0;font-size:20px}.close-btn{border:1px solid #cbbda0;background:transparent;border-radius:999px;width:34px;height:34px;color:#625c50}.history-scroll{overflow:auto;padding:14px 18px 28px}.history-item{border:1px solid #d0c2a4;background:rgba(251,247,238,.68);padding:14px;border-radius:12px;margin-bottom:9px;text-align:left;color:#403c34;transition:.2s}.history-item:hover{border-color:#9e8b63;transform:translateY(-1px)}.history-item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}.history-item .name{font-family:var(--serif);font-size:15px}.history-item .time{font-size:10px;color:#8b8478}.history-item .question{margin-top:7px;font-size:11px;line-height:1.7;color:#6f675b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drawer-footer{margin-top:auto;padding:14px 18px 20px;border-top:1px solid #d0c1a3}.danger-btn{border:1px solid #cbaaa0;background:rgba(157,92,77,.06);color:#9a6559;padding:9px 12px;border-radius:999px;font-size:11px}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#1d2823;color:#efe7d5;border:1px solid rgba(210,191,141,.26);padding:9px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}

/* Responsive */
@media(max-width:900px){.question-panel{grid-template-columns:1fr}.toss-stage{grid-template-columns:1fr}.hex-card{min-height:320px}.hero-result{grid-template-columns:150px 1fr}.result-grid{grid-template-columns:1fr}.read-card.full,.category-card{grid-column:auto}.paper-inner{padding:24px}.change-flow{grid-template-columns:1fr}.flow-arrow{transform:rotate(90deg)}}

<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark"><span>象</span></div><div class="brand-name">观 象 · 六 爻</div></div>

  <main>
    <section class="intro" id="introView">

        <div class="divider-orbit"><span></span></div>

        <button class="intro-btn" id="enterBtn" type="button">入 · 观 象</button>
        <div class="intro-seal">观心</div>
      </div>
    </section>

    <section class="app hidden" id="appView">
      <div class="paper">
        <div class="paper-inner">
          <section class="question-panel">
            <div>
              <div class="section-kicker">01 · 所 问</div>
              <div class="question-title">先写下你真正想知道的事</div>
              <textarea id="questionInput" class="question-input" maxlength="240" placeholder="例如：我正在考虑换工作，这段变化值得继续吗？"></textarea>
            </div>
            <div class="category-side">
              <div class="section-kicker">所 问 类 别</div>
              <div class="category-grid" id="categoryGrid"></div>
              <div class="category-note">类别只用于整理解读路径，不改变起卦结果。建议让问题尽量具体、单一。</div>
            </div>
          </section>

          <section id="ritualSection">
            <div class="progress-row">
              <div><div class="section-kicker">02 · 起 卦</div><div class="progress-title">由下而上，六次成卦</div></div>
              <div class="progress-meta" id="progressMeta">待起 · 0 / 6</div>
            </div>
            <div class="steps" id="steps"><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div></div>

            <div class="toss-stage">
              <div class="coin-desk">
                <div class="coins" id="coinsContainer">
                  <div class="coin" id="coin1"><div class="coin-face" id="coinFace1"></div></div>
                  <div class="coin" id="coin2"><div class="coin-face" id="coinFace2"></div></div>
                  <div class="coin" id="coin3"><div class="coin-face" id="coinFace3"></div></div>
                </div>
                <div class="toss-caption" id="tossCaption">请静心 · 准备第一爻</div>
                <div class="result-line" id="lineResult"></div>
                <button class="toss-btn-main" id="tossBtn" type="button">摇 · 一 爻</button>
              </div>

              <div class="hex-card">
                <div class="hex-status" id="hexStatus">卦象将由下而上显现</div>
                <div class="hex-title" id="hexTitle">未成之象</div>
                <div class="hex-glyph hidden" id="hexGlyph"></div>
                <div class="hex-lines" id="hexagramLines"></div>
                <div class="hex-empty" id="hexEmpty">每完成一爻<br>此处便多一分形迹</div>
              </div>
            </div>
          </section>

          <section class="result-wrap hidden" id="resultArea">
            <div class="result-head">
              <div><div class="section-kicker">03 · 观 象</div><h2>这一卦，先看其势</h2><p id="resultSub">——</p></div>
              <div class="result-actions"><button class="paper-btn" id="copyBtn" type="button">复制卦辞</button><button class="paper-btn" id="continueBtn" type="button">继续起卦</button><button class="paper-btn accent" id="newBtn" type="button">重新起卦</button></div>
            </div>

            <div id="resultContent"></div>

            <div class="archive-strip">
              <div class="archive-meta" id="archiveMeta">本次起卦将保存在本地浏览器</div>
              <button class="paper-btn" id="saveHintBtn" type="button">查看卜辞存档</button>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="historyDrawer" aria-hidden="true">
  <div class="drawer-head"><h3>卜 辞 存 档</h3><button class="close-btn" id="closeDrawer" type="button" aria-label="关闭">×</button></div>
  <div class="history-scroll" id="historyScroll"></div>
  <div class="drawer-footer"><button class="danger-btn" id="clearHistoryBtn" type="button">清空全部记录</button></div>
</aside>
<div class="toast" id="toast"></div>

function getTrigramName(yao1, yao2, yao3) {
  const key = [yao1, yao2, yao3].map(y => y ? '1' : '0').join('');
  const map = {'111':'乾','110':'兑','101':'离','100':'震','011':'巽','010':'坎','001':'艮','000':'坤'};
  return map[key];
}
function findHexagram(upperName, lowerName){return HEXAGRAMS.find(h=>h.upper===upperName&&h.lower===lowerName)}
const POSITION_NAMES=['初','二','三','四','五','上'];
function getYaoPositionName(index,isYang){return POSITION_NAMES[index]+(isYang?'九':'六')}

const CATEGORY_NAMES={shiyun:'时运',caiyun:'财运',jiazhai:'家宅',shenti:'身体',hunlian:'婚恋',xueye:'学业',shiye:'事业',chuxing:'出行',guansi:'官司',qiuzhi:'求职',touzi:'投资'};
const CATEGORY_KEYS=Object.keys(CATEGORY_NAMES);
const state={
  currentStep:0,
  lines:[],
  coinResults:[],
  isComplete:false,
  isAnimating:false,
  question:'',

  currentHex:null,
  relatedHex:null

const $=id=>document.getElementById(id);
const introView=$('introView'), appView=$('appView'), enterBtn=$('enterBtn');
const questionInput=$('questionInput'), categoryGrid=$('categoryGrid'), tossBtn=$('tossBtn');
const progressMeta=$('progressMeta'), steps=[...document.querySelectorAll('#steps .step')];
const tossCaption=$('tossCaption'), lineResult=$('lineResult'), hexagramLines=$('hexagramLines'), hexStatus=$('hexStatus'), hexTitle=$('hexTitle'), hexGlyph=$('hexGlyph'), hexEmpty=$('hexEmpty');
const resultArea=$('resultArea'), resultContent=$('resultContent'), resultSub=$('resultSub'), archiveMeta=$('archiveMeta');
const drawer=$('historyDrawer'), backdrop=$('drawerBackdrop'), historyScroll=$('historyScroll'), historyBtn=$('historyBtn'), closeDrawer=$('closeDrawer'), clearHistoryBtn=$('clearHistoryBtn'), saveHintBtn=$('saveHintBtn');

function renderCategories(){
  categoryGrid.innerHTML=CATEGORY_KEYS.map((k,i)=>`<button class="category-chip ${k===state.category?'active':''}" type="button" data-cat="${k}">${CATEGORY_NAMES[k]}</button>`).join('');
  categoryGrid.querySelectorAll('.category-chip').forEach(btn=>btn.addEventListener('click',()=>{
    state.category=btn.dataset.cat;
    renderCategories();
    if(state.isComplete) renderResult();
  }));
}
renderCategories();

enterBtn.addEventListener('click',()=>{
  introView.classList.add('hidden');
  appView.classList.remove('hidden');
  appView.classList.add('fade-in');
  questionInput.focus();
});

function normalizeQuestion(){
  const q=questionInput.value.trim();
  return q || '此刻未言明之事';
}

function updateProgress(){
  progressMeta.textContent=state.isComplete?'起卦完成 · 6 / 6':`进行中 · ${state.currentStep} / 6`;
  steps.forEach((el,i)=>{el.classList.toggle('done',i<state.currentStep);el.classList.toggle('current',i===state.currentStep&&!state.isComplete)});
  tossBtn.textContent=state.isComplete?'已 成 卦':`摇 · ${state.currentStep===0?'一':state.currentStep<6?['二','三','四','五','六'][state.currentStep]:'完'} 爻`;
}

function setCoinVisual(index, isBack){
  const el=$('coin'+index), face=$('coinFace'+index);
  el.className='coin '+(isBack?'back':'front');
  face.textContent=isBack?'背':'字';
}
function resetCoins(){[1,2,3].forEach(i=>{const el=$('coin'+i);el.className='coin';$('coinFace'+i).textContent='';});}

function tossCoins(){
  if(state.isAnimating||state.isComplete)return;
  state.isAnimating=true;
  tossBtn.disabled=true;
  state.question=normalizeQuestion();
  const coins=[Math.random()<.5,Math.random()<.5,Math.random()<.5];
  state.coinResults.push(coins);
  resetCoins();
  [1,2,3].forEach(i=>$('coin'+i).classList.add('flipping'));

  setTimeout(()=>{
    [1,2,3].forEach((i,idx)=>setCoinVisual(i,coins[idx]));
    const backCount=coins.filter(Boolean).length;
    let value,changing,typeName;
    if(backCount===3){value=true;changing=true;typeName='老阳 · 动爻';}
    else if(backCount===0){value=false;changing=true;typeName='老阴 · 动爻';}
    else if(backCount===2){value=true;changing=false;typeName='少阳 · 静爻';}
    else {value=false;changing=false;typeName='少阴 · 静爻';}
    state.lines.push({value,changing});
    const posName=getYaoPositionName(state.currentStep,value);
    lineResult.innerHTML=`<span class="gold">${posName}</span> · ${typeName}`;
    state.currentStep++;
    if(state.currentStep>=6){
      state.isComplete=true;
      tossCaption.textContent='六爻已定 · 可观其象';
      setTimeout(completeReading,320);
    }else{
      tossCaption.textContent=`下一步 · 第 ${['二','三','四','五','六'][state.currentStep-1]} 爻`;
      tossBtn.disabled=false;
    }
    updateProgress();
    renderHexagram();
    state.isAnimating=false;
  },780);
}
tossBtn.addEventListener('click',tossCoins);

function renderHexagram(){
  hexagramLines.innerHTML='';
  state.lines.slice().reverse().forEach((line,reverseIndex)=>{
    const index=state.lines.length-1-reverseIndex;
    const div=document.createElement('div');
    div.className='yao-line'+(line.changing?' changing':'');
    const shape=document.createElement('span');
    shape.className='line-shape '+(line.value?'yang':'yin');
    const label=document.createElement('span');label.className='yao-label';label.textContent=getYaoPositionName(index,line.value);
    div.append(shape,label);hexagramLines.appendChild(div);
  });
  hexEmpty.classList.toggle('hidden',state.lines.length>0);
  hexStatus.textContent=state.isComplete?'本卦已成 · 正在展开':'卦象将由下而上显现';
  hexTitle.textContent=state.isComplete?'本 卦':'未成之象';
}

function getCurrentHexagram(){
  const lower=[state.lines[0].value,state.lines[1].value,state.lines[2].value];
  const upper=[state.lines[3].value,state.lines[4].value,state.lines[5].value];
  return findHexagram(getTrigramName(...upper),getTrigramName(...lower));
}
function getRelatedHexagram(){
  const related=state.lines.map(l=>({value:l.changing?!l.value:l.value}));
  const lower=[related[0].value,related[1].value,related[2].value];
  const upper=[related[3].value,related[4].value,related[5].value];
  return findHexagram(getTrigramName(...upper),getTrigramName(...lower));
}
function renderYaoPreview(lines){
  return `<div class="hex-lines">${lines.slice().reverse().map((line,rev)=>{const i=lines.length-1-rev;return `<div class="yao-line${line.changing?' changing':''}"><span class="line-shape ${line.value?'yang':'yin'}"></span><span class="yao-label">${getYaoPositionName(i,line.value)}</span></div>`}).join('')}</div>`;
}

function completeReading(){
  const hex=getCurrentHexagram();
  if(!hex)return;
  state.currentHex=hex;
  state.relatedHex=getRelatedHexagram();
  hexGlyph.textContent=hex.unicode;
  hexGlyph.classList.remove('hidden');
  hexTitle.textContent=`${hex.name} · ${hex.upper}${hex.lower}`;
  hexStatus.textContent='本卦 · 六爻已定';
  resultArea.classList.remove('hidden');
  resultArea.classList.add('fade-in');
  resultSub.textContent=`${hex.meaning} · ${CATEGORY_NAMES[state.category]}路径`;
  renderResult();
  saveHistory();
  archiveMeta.textContent=`已保存 · ${new Date().toLocaleString('zh-CN',{hour12:false})}`;
  resultArea.scrollIntoView({behavior:'smooth',block:'start'});
}

const CATEGORY_LENSES={
  shiyun:'从时机、节奏与当前阶段观察此卦。重点不是给出固定的吉凶结论，而是看当下更适合推进、等待、调整还是守持。',
  caiyun:'从资源流动、得失尺度与积累方式观察此卦。可重点留意获取、支出、合作与风险边界，而不把卦象当作确定的财务结果。',
  jiazhai:'从家庭关系、相处方式与环境秩序观察此卦。重点放在人与人之间如何分工、沟通与彼此支持。',
  shenti:'从传统易学的象义系统观察此卦所对应的身体意象与生活节奏。这里只作传统文化层面的阅读，不替代医学判断或诊疗。',
  hunlian:'从关系中的感应、边界、沟通与变化观察此卦。可结合卦象所呈现的靠近、疏离、等待或调整等主题反思关系状态。',
  xueye:'从学习节奏、积累方式、师友关系与专注状态观察此卦。重点在于理解此时更适合启蒙、积累、突破还是复习沉淀。',
  shiye:'从行动方向、组织方式、进退节奏与长期积累观察此卦。可用来梳理当下工作的重点、阻力与可调整之处。',
  chuxing:'从出发、路径、环境与节奏观察此卦。重点是理解象中所提示的顺行、绕行、停留或准备等行动主题。',
  guansi:'从冲突、规则、立场与沟通方式观察此卦。这里呈现的是传统象义，不构成法律意见；现实中的法律问题应以事实与专业意见为依据。',
  qiuzhi:'从机会、准备、表达与人与人之间的连接观察此卦。可用于反思当前求职阶段需要补足什么、主动什么，以及如何选择路径。',
  touzi:'从资源配置、节奏、风险意识与取舍观察此卦。这里仅作传统文化语境下的象义阅读，不构成投资建议。'
};
function renderResult(){
  const hex=state.currentHex;if(!hex)return;
  const categories=HEXAGRAM_CATEGORIES[hex.name]||{};
  const details=HEXAGRAM_DETAILS[hex.name]||{};
  const changingIndices=state.lines.map((l,i)=>l.changing?i:-1).filter(i=>i>=0);
  const categoryText=categories[state.category]||'此卦在该主题下暂无单独展开。';
  const relation=state.relatedHex;

  const hero=`<section class="hero-result">
    <div class="hero-glyph">${hex.unicode}</div>
    <div class="hero-meta">
      <div class="small">本 卦 · ${hex.upper} 上 / ${hex.lower} 下</div>
      <h3>${hex.name}</h3>
      <div class="hero-meaning">${hex.meaning}</div>
      <div class="hero-question"><b>所问：</b>${escapeHtml(state.question)}<br><b>观象：</b>${escapeHtml(categoryText)}</div>
    </div>
  </section>`;

  const changeFlow=relation&&relation.name!==hex.name?`<section class="change-flow">
    <div class="flow-node"><div class="glyph">${hex.unicode}</div><div class="name">${hex.name}</div><div class="sub">本卦 · 当前之象</div></div>
    <div class="flow-arrow">→<div class="change-badge">${changingIndices.length?`动 ${changingIndices.length} 爻`:'静'}</div></div>
    <div class="flow-node"><div class="glyph">${relation.unicode}</div><div class="name">${relation.name}</div><div class="sub">变卦 · 后续之势</div></div>
  </section>`:`<section class="read-card full"><div class="card-kicker">变 化</div><div class="card-title">此卦无动爻</div><div class="card-body">没有发生爻变，本次以本卦之象为主要参考，适合把注意力放在当前状态与守持之道。</div></section>`;

  const changingBlock=changingIndices.length?`<section class="read-card"><div class="card-kicker">动 爻</div><div class="card-title">变化发生在哪里</div><div class="card-body">${changingIndices.map(idx=>`<div class="classical" style="margin-bottom:8px"><b>${getYaoPositionName(idx,state.lines[idx].value)}</b>：${hex.lines[idx].replace(/^[^：]*：/,'')}</div>`).join('')}<div style="font-size:11px;color:#8b8477">动爻提示的是变化位置，而不是单一的好坏结论。</div></div></section>`:'';

  const core=`<section class="read-card"><div class="card-kicker">卦 辞</div><div class="card-title">经典原文</div><div class="card-body"><div class="classical">${hex.judgment}</div><div style="margin-top:10px"><span style="color:#8e7444">象辞：</span>${hex.image}</div></div></section>`;

  const baihua=details.baihua?`<section class="read-card full"><div class="card-kicker">白 话</div><div class="card-title">把古义说回今天</div><div class="card-body quote-list">${(Array.isArray(details.baihua)?details.baihua:[details.baihua]).map(p=>`<p>${p.replace(/「([^」]*)」/g,'<span class="classical">$1</span>')}</p>`).join('')}</div></section>`:'';
  const stories=details.stories&&details.stories.length?`<section class="read-card"><div class="card-kicker">典 故</div><div class="card-title">与此象相应的故事</div><div class="card-body">${details.stories.map(s=>`<div class="story"><h4>${escapeHtml(s.title)}</h4><p>${escapeHtml(s.text)}</p>${s.source?`<div class="source">— ${escapeHtml(s.source)}</div>`:''}</div>`).join('')}</div></section>`:'';
  const notice=(details.disaster||details.avoidance)?`<section class="read-card"><div class="card-kicker">卦 中 提 醒</div><div class="card-title">需要留意什么</div><div class="card-body">${details.disaster?`<div class="notice"><strong>留意</strong><p>${escapeHtml(details.disaster)}</p></div>`:''}${details.avoidance?`<div class="notice" style="margin-top:9px"><strong>可以怎样做</strong><p>${escapeHtml(details.avoidance)}</p></div>`:''}</div></section>`:'';

  const categoryName=CATEGORY_NAMES[state.category];
  const categoryLens=CATEGORY_LENSES[state.category]||'从当前主题的角度观察此卦，把经典象义放回你的具体问题与现实处境中理解。';
  const relationText=relation&&relation.name!==hex.name
    ? `本卦以“${hex.meaning}”为当下的象义底色；动爻之后转为“${relation.meaning}”。可以把这理解为观察重点的移动，而不是对未来作确定判断。`
    : `本卦以“${hex.meaning}”为主要象义底色。本次无动爻，主题解读更适合围绕当前状态、处境与守持方式展开。`;
  const catTabs=`<section class="read-card category-card"><div class="card-kicker">主题 解读</div><div class="card-title">看看此卦对应不同领域的象义</div><div class="cat-tabs">${CATEGORY_KEYS.map(k=>`<button type="button" class="cat-tab ${k===state.category?'active':''}" data-cat="${k}">${CATEGORY_NAMES[k]}</button>`).join('')}</div><div class="theme-lead"><div class="theme-label">当前主题 · ${escapeHtml(categoryName)}</div><div class="theme-title">${escapeHtml(categoryName)}中的此卦</div><p>${escapeHtml(categoryText)}</p></div><div class="theme-panels"><div class="theme-panel"><h4>卦象底色</h4><p>${escapeHtml(hex.meaning)}。象辞曰：“${escapeHtml(hex.image)}”</p></div><div class="theme-panel"><h4>主题观察</h4><p>${escapeHtml(categoryLens)}</p></div><div class="theme-panel"><h4>变化提示</h4><p>${escapeHtml(relationText)}</p></div></div><div class="theme-classic"><div class="classical"><span style="color:#8e7444">经典依据：</span>${escapeHtml(hex.judgment)}</div></div><div class="theme-footnote">主题内容沿用本卦已有的分类解读数据；“主题观察”用于帮助你理解阅读角度，不等同于现实预测或专业结论。</div></section>`;

  const safety=`<section class="read-card full"><div class="notice"><strong>观象说明</strong><p>这里呈现的是传统易经卦象与原有内容数据的文化解读，不把卦象当作确定事实，也不替代专业的医疗、法律、财务或现实决策。真正重要的，仍是你如何理解当下、如何行动。</p></div></section>`;
  resultContent.innerHTML=hero+changeFlow+core+changingBlock+baihua+stories+notice+catTabs+safety;
  resultContent.querySelectorAll('.cat-tab').forEach(btn=>btn.addEventListener('click',()=>{
    state.category=btn.dataset.cat;renderCategories();renderResult();
  }));
}

function escapeHtml(str){return String(str??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}

// ==========================================================
// 4. 历史存档
// ==========================================================
const HISTORY_KEY='guanxiang_history_v2';
function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch{return[]}}
function saveHistory(){
  if(!state.currentHex)return;
  const record={
    id:Date.now(),time:new Date().toLocaleString('zh-CN',{hour12:false}),question:state.question,category:state.category,
    hexagramName:state.currentHex.name,hexagramUnicode:state.currentHex.unicode,jungment:state.currentHex.judgment,
    meaning:state.currentHex.meaning,lines:state.lines.map(l=>({value:l.value,changing:l.changing})),
    changingCount:state.lines.filter(l=>l.changing).length,related:state.relatedHex?{name:state.relatedHex.name,unicode:state.relatedHex.unicode,judgment:state.relatedHex.judgment,upper:state.relatedHex.upper,lower:state.relatedHex.lower}:null
  };
  const records=getHistory();records.unshift(record);while(records.length>30)records.pop();localStorage.setItem(HISTORY_KEY,JSON.stringify(records));renderHistory();
}
function renderHistory(){
  const records=getHistory();
  if(!records.length){historyScroll.innerHTML='<div style="padding:42px 10px;text-align:center;color:#8b8477;font-family:var(--serif)">尚无卜辞<br><span style="font-size:11px">完成第一次起卦后，这里会成为你的个人观象档案。</span></div>';return;}
  historyScroll.innerHTML=records.map(r=>`<button class="history-item" type="button" data-id="${r.id}"><div class="top"><span class="name">${r.hexagramUnicode} ${r.hexagramName} · ${CATEGORY_NAMES[r.category]||'未分类'}</span><span class="time">${r.time}</span></div><div class="question">${escapeHtml(r.question||'未记录问题')}</div></button>`).join('');
  historyScroll.querySelectorAll('.history-item').forEach(btn=>btn.addEventListener('click',()=>showHistoryDetail(Number(btn.dataset.id))));
}
function showHistoryDetail(id){
  const r=getHistory().find(x=>x.id===id);if(!r)return;
  state.question=r.question||'';state.category=r.category||'shiyun';state.lines=r.lines||[];state.currentStep=6;state.isComplete=true;state.isAnimating=false;
  state.currentHex=HEXAGRAMS.find(h=>h.name===r.hexagramName);state.relatedHex=r.related?HEXAGRAMS.find(h=>h.name===r.related.name):null;
  appView.classList.remove('hidden');introView.classList.add('hidden');resultArea.classList.remove('hidden');questionInput.value=state.question;renderCategories();updateProgress();renderHexagram();if(state.currentHex)renderResult();closeHistory();
  window.scrollTo({top:0,behavior:'smooth'});
}
function openHistory(){renderHistory();drawer.classList.add('open');backdrop.classList.add('open');drawer.setAttribute('aria-hidden','false')}
function closeHistory(){drawer.classList.remove('open');backdrop.classList.remove('open');drawer.setAttribute('aria-hidden','true')}
historyBtn.addEventListener('click',openHistory);closeDrawer.addEventListener('click',closeHistory);backdrop.addEventListener('click',closeHistory);saveHintBtn.addEventListener('click',openHistory);
clearHistoryBtn.addEventListener('click',()=>{if(confirm('确定要清空全部卜辞存档吗？')){localStorage.removeItem(HISTORY_KEY);renderHistory();showToast('已清空本地存档')}});

// ==========================================================
// 5. 新起卦 / 复制
// ==========================================================
function resetReading(options={}){
  const {preserveQuestion=false, preserveCategory=false}=options;
  state.currentStep=0;state.lines=[];state.coinResults=[];state.isComplete=false;state.isAnimating=false;state.currentHex=null;state.relatedHex=null;
  if(!preserveQuestion){state.question='';questionInput.value='';}
  if(!preserveCategory){state.category='shiyun';renderCategories();}
  lineResult.innerHTML='';tossCaption.textContent='请静心 · 准备第一爻';resultArea.classList.add('hidden');resetCoins();hexagramLines.innerHTML='';hexGlyph.classList.add('hidden');hexEmpty.classList.remove('hidden');hexTitle.textContent='未成之象';hexStatus.textContent='卦象将由下而上显现';updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(()=>questionInput.focus(),180);
}
$('continueBtn').addEventListener('click',()=>{
  resetReading({preserveQuestion:true,preserveCategory:true});
  showToast('已回到起卦入口，可修改问题后继续');
});
$('newBtn').addEventListener('click',()=>{
  resetReading();
  showToast('已开启新的卜问');
});
$('copyBtn').addEventListener('click',async()=>{
  const h=state.currentHex;if(!h)return;
  const change=state.relatedHex&&state.relatedHex.name!==h.name?`变卦：${state.relatedHex.name} ${state.relatedHex.judgment}`:'';
  const text=`观象 · ${h.unicode} ${h.name}\n所问：${state.question}\n卦辞：${h.judgment}\n象辞：${h.image}\n含义：${h.meaning}\n${change}`;
  try{await navigator.clipboard.writeText(text);showToast('卦辞已复制')}catch{showToast('当前浏览器不允许复制，请手动选取')} 
});

function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1800)}

updateProgress();renderHexagram();renderHistory();
</script>
</body>
